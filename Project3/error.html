<!DOCTYPE html>
<html>
<head>
  <title>Authentication Error</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 20px;
    }
    .header {
      background-color: blue;
      color: yellow;
      font-size: 26px;
      padding: 20px;
      font-weight: bold;
    }
    .error-title {
      color: red;
      font-size: 60px;
      margin: 50px 0 30px;
      font-weight: bold;
    }
    .error-message {
      color: red;
      font-size: 22px;
      margin: 10px 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">Enterprise Web Management System</div>
  <div class="error-title">Authentication Error</div>
  <div class="error-message">"Username and/or Password Not Recognized"</div>
  <div class="error-message">Access To System Is Denied</div>
  <div class="error-message">Please Try Again Later</div>
</body>
</html>
